services:
  photobooth:
    build:
      context: .
      args:
        # Secret used to build Vite frontend bundle (for offline HMAC validation).
        # MUST match LICENSE_SECRET_KEY below.
        # Set via host env: export VITE_LICENSE_SECRET=$(cat .license_secret)
        VITE_LICENSE_SECRET: ${VITE_LICENSE_SECRET:?Set VITE_LICENSE_SECRET env var before docker compose up (64-char hex)}
        # Set to 1 to enforce license activation gate (only for dedicated vendor builds).
        # Leave empty/0 for self-host deployment to keep live tenants working.
        VITE_LICENSE_ENFORCE: ${VITE_LICENSE_ENFORCE:-0}
    container_name: photobooth
    restart: unless-stopped
    ports:
      - "8099:8080"            # host 8099 -> container 8080 (hindari bentrok dgn 80/3000/8080)
    environment:
      NODE_ENV: production
      PORT: "8080"
      ADMIN_EMAIL: "admin@photobooth.local"   # GANTI email admin (sesuai keinginan)
      ADMIN_PASSWORD: "admin123"             # GANTI password admin (jangan pakai default)
      PB_DEFAULT_TENANT: "booth"             # tenant default saat seeding; 'default' tidak pernah dibuat otomatis
      PGHOST: postgres-kontrakan   # hostname Postgres di docker network
      PGPORT: "5432"
      PGUSER: photobooth
      PGDATABASE: photobooth
      # License secret: must match VITE_LICENSE_SECRET above. Used to:
      #   - generate HMAC-signed codes via /api/admin/license/generate
      #   - verify redeem + revoke via /api/admin/license/redeem + /verify
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      LICENSE_SECRET_KEY: ${LICENSE_SECRET_KEY:?Set LICENSE_SECRET_KEY env var (64-char hex, must match VITE_LICENSE_SECRET)}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD env var (DB password for 'photobooth' user) — generate via docker exec postgres-kontrakan psql -c "ALTER USER photobooth PASSWORD '\password'"}
    networks:
      - photobooth-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  photobooth-net:
    name: photobooth-net
    driver: bridge
    external: true
