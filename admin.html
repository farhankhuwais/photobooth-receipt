<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photobooth Admin</title>
<style>
  :root { --ink:#000; --bg:#fde047; --card:#fff; --line:#000; --side:#111; --side-hover:#222; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 18px; border-bottom:4px solid var(--line); background:#fff; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; font-weight:900; text-transform:uppercase; letter-spacing:-0.5px; }
  .layout { display:flex; min-height:calc(100vh - 64px); }
  /* Sidebar */
  .sidebar { width:220px; flex:0 0 220px; background:var(--side); color:#fff; padding:14px 10px; display:flex; flex-direction:column; gap:6px; transition:width .15s, padding .15s; }
  .sidebar.hidden { display:none; }
  .menu-btn { background:#fff; color:#000; border:3px solid #000; width:44px; height:44px; font-size:20px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; box-shadow:3px 3px 0 #000; }
  .menu-btn:hover { background:#000; color:#fff; }
  .menu-btn:active { box-shadow:0 0 0 #000; transform:translate(3px,3px); }
  .sidebar .navbtn { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:12px 14px; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:#fff; background:transparent; border:2px solid transparent; cursor:pointer; border-radius:4px; }
  .sidebar .navbtn:hover { background:var(--side-hover); }
  .sidebar .navbtn.active { background:#fff; color:#000; }
  .sidebar .spacer { flex:1; }
  .sidebar .iconbtn { background:transparent; color:#fff; border:2px solid #555; width:40px; height:40px; font-size:18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; }
  .sidebar .iconbtn:hover { background:var(--side-hover); }
  .sidebar .row { display:flex; gap:8px; padding:6px; }
  .content { flex:1; padding:20px; overflow:auto; }
  .wrap { padding:0; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  .card { background:var(--card); border:4px solid var(--line); box-shadow:6px 6px 0 #000; padding:16px; }
  .card .label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; opacity:.6; }
  .card .val { font-size:30px; font-weight:900; margin-top:4px; }
  .card .sub { font-size:12px; margin-top:6px; opacity:.7; }
  table { width:100%; border-collapse:collapse; background:#fff; border:4px solid var(--line); box-shadow:6px 6px 0 #000; margin-top:18px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:2px solid var(--line); font-size:14px; }
  th { background:#000; color:#fff; text-transform:uppercase; font-size:11px; letter-spacing:1px; }
  tr:nth-child(even) td { background:#fafafa; }
  .pill { display:inline-block; padding:2px 8px; border:2px solid #000; border-radius:2px; font-size:11px; font-weight:800; text-transform:uppercase; }
  .pill.qris { background:#bbf7d0; }
  .pill.cash { background:#fde68a; }
  h2 { font-size:16px; font-weight:900; text-transform:uppercase; margin:28px 0 8px; }
  .txwrap { max-height:52vh; overflow:auto; border:4px solid var(--line); box-shadow:6px 6px 0 #000; background:#fff; }
  .txwrap table { margin-top:0; border:none; box-shadow:none; }
  .pager { display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .pager button { padding:8px 14px; font-weight:800; text-transform:uppercase; cursor:pointer; border:3px solid #000; background:#fff; color:#000; }
  .pager button:hover:not(:disabled) { background:#000; color:#fff; }
  .pager button:disabled { opacity:.4; cursor:not-allowed; }
  .pager .info { font-size:13px; font-weight:800; }
  #err { background:#fee2e2; border:3px solid #000; padding:10px 12px; margin-bottom:14px; font-weight:700; display:none; }
  button.refresh { background:#000; color:#fff; border:3px solid #000; padding:8px 16px; font-weight:800; text-transform:uppercase; cursor:pointer; }
  button.refresh:hover { background:#fff; color:#000; }
  button.logout { background:#fff; color:#000; border:3px solid #000; padding:8px 16px; font-weight:800; text-transform:uppercase; cursor:pointer; }
  button.logout:hover { background:#000; color:#fff; }
  /* Login form */
  #login { max-width:360px; margin:60px auto; background:#fff; border:4px solid var(--line); box-shadow:8px 8px 0 #000; padding:24px; }
  #login h2 { margin:0 0 14px; text-align:center; }
  #login label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; margin:10px 0 4px; }
  #login input { width:100%; padding:12px; font-size:16px; border:3px solid #000; }
  #login button { width:100%; margin-top:14px; padding:12px; background:#000; color:#fff; border:3px solid #000; font-weight:900; text-transform:uppercase; cursor:pointer; }
  #login button:hover { background:#fff; color:#000; }
  #login .err { background:#fee2e2; border:2px solid #000; padding:8px; margin-top:10px; font-weight:700; display:none; }
  /* Filters + export bar */
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; background:#fff; border:4px solid var(--line); box-shadow:6px 6px 0 #000; padding:14px; margin-top:18px; }
  .filters .field { display:flex; flex-direction:column; }
  .filters label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; opacity:.6; margin-bottom:4px; }
  .filters input[type=date] { padding:10px; font-size:14px; border:3px solid #000; }
  .filters button { padding:10px 14px; font-weight:800; text-transform:uppercase; cursor:pointer; border:3px solid #000; }
  .filters button.apply { background:#000; color:#fff; }
  .filters button.apply:hover { background:#fff; color:#000; }
  /* Photos grid checkbox + select state */
  .photocard { position:relative; }
  .photocard.sel { outline:4px solid #ef4444; outline-offset:2px; }
  .photocard .pick { position:absolute; top:6px; left:6px; width:28px; height:28px; cursor:pointer; }
  .photocard .del { position:absolute; top:6px; right:6px; width:32px; height:32px; font-size:16px; cursor:pointer; background:#ef4444; color:#fff; border:2px solid #000; display:inline-flex; align-items:center; justify-content:center; }
  .photocard .del:hover { background:#000; color:#ef4444; }
  button.csv { background:#bbf7d0; color:#000; }
  button.csv:hover { background:#000; color:#bbf7d0; }
  button.iconbtn { background:transparent; color:#000; border:3px solid #000; box-shadow:3px 3px 0 #000; width:44px; height:44px; font-size:20px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  button.iconbtn:hover { background:#000; color:#fff; }
  button.iconbtn:active { box-shadow:0 0 0 #000; transform:translate(3px,3px); }
  .filters .spacer { flex:1; }
  .quickgroup { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .quickgroup .qlabel { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; opacity:.6; }
  .quickgroup .quick { padding:8px 12px; font-weight:800; text-transform:uppercase; cursor:pointer; border:3px solid #000; background:#fff; color:#000; font-size:12px; }
  .quickgroup .quick:hover { background:#000; color:#fff; }
  /* Change password — modal popup */
  #pwPanel { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  #pwPanel .box { width:100%; max-width:420px; background:#fff; border:4px solid var(--line); box-shadow:8px 8px 0 #000; padding:20px; }
  #pwPanel .top { display:flex; justify-content:space-between; align-items:center; }
  #pwPanel h2 { margin:0; }
  #pwPanel .x { background:#fff; color:#000; border:3px solid #000; width:36px; height:36px; font-size:18px; font-weight:900; cursor:pointer; }
  #pwPanel .x:hover { background:#000; color:#fff; }
  #pwPanel label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; margin:10px 0 4px; }
  #pwPanel input { width:100%; padding:11px; font-size:15px; border:3px solid #000; }
  #pwPanel .row { display:flex; gap:10px; }
  #pwPanel .row button { flex:1; margin-top:14px; padding:11px; font-weight:900; text-transform:uppercase; cursor:pointer; border:3px solid #000; }
  #pwPanel .save { background:#000; color:#fff; }
  #pwPanel .save:hover { background:#fff; color:#000; }
  #pwPanel .cancel { background:#fff; color:#000; }
  #pwPanel .cancel:hover { background:#000; color:#fff; }
  #pwPanel .err { background:#fee2e2; border:2px solid #000; padding:8px; margin-top:10px; font-weight:700; display:none; }
  #pwPanel .ok { background:#bbf7d0; border:2px solid #000; padding:8px; margin-top:10px; font-weight:700; display:none; }
  /* Photos grid */
  .photogrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-top:14px; }
  .photocard { background:#fff; border:4px solid var(--line); box-shadow:6px 6px 0 #000; padding:8px; }
  .photocard img { width:100%; height:auto; display:block; border:2px solid #000; cursor:pointer; }
  .photocard .meta { font-size:11px; font-weight:800; text-transform:uppercase; margin-top:6px; opacity:.7; }
  .photocard a { display:inline-block; margin-top:6px; font-size:11px; font-weight:800; text-transform:uppercase; color:#000; text-decoration:underline; }
  #photoErr { background:#fee2e2; border:3px solid #000; padding:10px 12px; margin-top:14px; font-weight:700; display:none; }
  /* Lightbox */
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; }
  #lb img { max-width:92vw; max-height:88vh; border:4px solid #fff; }
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="menu-btn" title="Buka/Tutup menu" onclick="toggleSidebar()">☰</button>
    <h1>📸 Photobooth Admin</h1>
  </div>
  <div id="headerActions" style="display:none">
    <button class="iconbtn guide" title="Panduan Bingkai Canva" onclick="window.open('/guides/README.html','_blank')">📐</button>
    <button class="iconbtn pw" title="Ganti Password" onclick="showPwPanel()">🔑</button>
    <button class="iconbtn out" title="Logout" onclick="doLogout()">🚪</button>
  </div>
</header>

<!-- Login email+password -->
<div id="login" style="display:none">
  <h2>🔒 Admin Login</h2>
  <label for="email">Email</label>
  <input id="email" type="email" placeholder="email" autocomplete="username" />
  <label for="password">Password</label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
  <button onclick="doLogin()">Masuk</button>
  <div class="err" id="loginErr"></div>
  </div>

<div class="layout" id="dash" style="display:none">
  <!-- Sidebar -->
  <nav class="sidebar">
    <button class="navbtn active" id="navDash" onclick="showView('dash')">📊 Dashboard</button>
    <button class="navbtn" id="navPhotos" onclick="showView('photos')">🖼️ Foto</button>
    <div class="spacer"></div>
    <div class="row">
      <button class="iconbtn guide" title="Panduan Bingkai Canva" onclick="window.open('/guides/README.html','_blank')">📐</button>
      <button class="iconbtn pw" title="Ganti Password" onclick="showPwPanel()">🔑</button>
      <button class="iconbtn out" title="Logout" onclick="doLogout()">🚪</button>
    </div>
  </nav>

  <div class="content">
    <!-- VIEW: Dashboard -->
    <div class="wrap" id="viewDash">
      <div id="err"></div>
      <div class="filters">
        <div class="field">
          <label for="from">Dari</label>
          <input id="from" type="date" />
        </div>
        <div class="field">
          <label for="to">Sampai</label>
          <input id="to" type="date" />
        </div>
        <button class="apply" onclick="applyFilter()">Terapkan</button>
        <button class="apply" onclick="resetFilter()">Reset</button>
        <div class="quickgroup">
          <span class="qlabel">Cepat:</span>
          <button class="quick" onclick="quickRange('today')">Hari Ini</button>
          <button class="quick" onclick="quickRange('7d')">7 Hari</button>
          <button class="quick" onclick="quickRange('30d')">30 Hari</button>
          <button class="quick" onclick="quickRange('month')">Bulan Ini</button>
        </div>
        <div class="spacer"></div>
        <a href="/guides/README.html" target="_blank" rel="noreferrer"
           style="display:inline-flex; align-items:center; gap:6px; padding:10px 14px; font-weight:800; text-transform:uppercase; cursor:pointer; border:3px solid #000; background:#fff; color:#000; text-decoration:none; font-size:12px;">
          📐 Panduan Bingkai Canva
        </a>
        <button class="csv" onclick="exportCsv()">⬇ Export CSV</button>
      </div>

      <div class="grid" id="kpis"></div>
      <h2>Jam Sibuk (hari ini)</h2>
      <div class="card" id="hours">—</div>
      <h2>Transaksi Terakhir</h2>
      <div class="txwrap">
        <table>
          <thead><tr><th>Waktu</th><th>Metode</th><th>Mode</th><th>Preset</th><th>Template</th><th>Nominal</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6">memuat…</td></tr></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prevPage" onclick="goPage(-1)">‹ Sebelumnya</button>
        <span class="info" id="pageInfo">—</span>
        <button id="nextPage" onclick="goPage(1)">Berikutnya ›</button>
      </div>
    </div>

    <!-- VIEW: Foto -->
    <div class="wrap" id="viewPhotos" style="display:none">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap;">
        <h2 style="margin:0">🖼️ Foto Hasil (DB)</h2>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button class="refresh" onclick="loadPhotos()">↻ Refresh</button>
          <button class="apply" id="bulkDelBtn" style="display:none; background:#ef4444; color:#fff; border-color:#000;" onclick="bulkDelete()">🗑 Hapus Terpilih (<span id="selCount">0</span>)</button>
        </div>
      </div>
      <div class="filters">
        <div class="field">
          <label for="pfrom">Dari</label>
          <input id="pfrom" type="date" />
        </div>
        <div class="field">
          <label for="pto">Sampai</label>
          <input id="pto" type="date" />
        </div>
        <button class="apply" onclick="applyPhotoFilter()">Terapkan</button>
        <button class="apply" onclick="resetPhotoFilter()">Reset</button>
        <div class="quickgroup">
          <span class="qlabel">Cepat:</span>
          <button class="quick" onclick="photoQuick('today')">Hari Ini</button>
          <button class="quick" onclick="photoQuick('7d')">7 Hari</button>
          <button class="quick" onclick="photoQuick('30d')">30 Hari</button>
        </div>
        <div class="spacer"></div>
        <label style="display:flex; align-items:center; gap:6px; font-weight:800; text-transform:uppercase; font-size:12px; cursor:pointer;">
          <input type="checkbox" id="selAll" onchange="toggleSelectAll(this.checked)" /> Pilih Semua
        </label>
      </div>
      <div id="photoErr"></div>
      <div class="photogrid" id="photogrid"><div style="opacity:.6; font-weight:800;">memuat…</div></div>
    </div>
  </div>
</div>

<!-- Panel ganti password (modal popup) -->
<div id="pwPanel" onclick="if(event.target===this)hidePwPanel()">
  <div class="box">
    <div class="top">
      <h2>🔑 Ganti Password</h2>
      <button class="x" title="Tutup" onclick="hidePwPanel()">×</button>
    </div>
    <label for="pwCurrent">Password Lama</label>
    <input id="pwCurrent" type="password" placeholder="••••••••" autocomplete="current-password" />
    <label for="pwNew">Password Baru (min 6 karakter)</label>
    <input id="pwNew" type="password" placeholder="••••••••" autocomplete="new-password" />
    <label for="pwConfirm">Ulangi Password Baru</label>
    <input id="pwConfirm" type="password" placeholder="••••••••" autocomplete="new-password" />
    <div class="row">
      <button class="cancel" onclick="hidePwPanel()">Batal</button>
      <button class="save" onclick="doChangePw()">Simpan</button>
    </div>
    <div class="err" id="pwErr"></div>
    <div class="ok" id="pwOk">Password berhasil diubah</div>
  </div>
</div>

<!-- Lightbox -->
<div id="lb" onclick="this.style.display='none'">
  <img id="lbImg" src="" alt="preview" />
</div>

<script>
const PAGE_SIZE = 25
let allTx = []
let page = 1
let currentView = 'dash'

function toggleSidebar() {
  const sb = document.querySelector('.sidebar')
  if (sb) sb.classList.toggle('hidden')
}

function showView(v) {
  currentView = v
  document.getElementById('viewDash').style.display = v === 'dash' ? 'block' : 'none'
  document.getElementById('viewPhotos').style.display = v === 'photos' ? 'block' : 'none'
  document.getElementById('navDash').classList.toggle('active', v === 'dash')
  document.getElementById('navPhotos').classList.toggle('active', v === 'photos')
  if (v === 'photos') loadPhotos()
}

function renderPage() {
  const total = allTx.length
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE))
  if (page > pages) page = pages
  if (page < 1) page = 1
  const start = (page - 1) * PAGE_SIZE
  const slice = allTx.slice(start, start + PAGE_SIZE)
  document.getElementById('rows').innerHTML = slice.length
    ? slice.map(t => `<tr><td>${fmtTime(t.created_at)}</td><td><span class="pill ${t.method}">${t.method}</span></td><td>${t.mode === 'event' ? 'Event' : 'Regular'}</td><td>${t.preset || '-'}</td><td>${t.template||'-'}</td><td>${fmt(t.amount)}</td></tr>`).join('')
    : '<tr><td colspan="6">belum ada transaksi</td></tr>'
  document.getElementById('pageInfo').textContent = `Hal ${page} / ${pages} (${total} transaksi)`
  document.getElementById('prevPage').disabled = page <= 1
  document.getElementById('nextPage').disabled = page >= pages
}
function goPage(d) { page += d; renderPage() }
const fmt = (n) => 'Rp ' + Number(n).toLocaleString('id-ID')
const fmtTime = (iso) => new Date(iso).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })

function showLogin() {
  document.getElementById('headerActions').style.display = 'none'
  document.getElementById('dash').style.display = 'none'
  document.getElementById('login').style.display = 'block'
  const e = document.getElementById('email'); if (e) e.value = ''
  const p = document.getElementById('password'); if (p) p.value = ''
  const le = document.getElementById('loginErr'); if (le) le.style.display = 'none'
}
function showDash() {
  document.getElementById('login').style.display = 'none'
  document.getElementById('dash').style.display = 'flex'
  document.getElementById('headerActions').style.display = 'flex'
  const now = new Date()
  const z = (n) => String(n).padStart(2, '0')
  const today = `${now.getFullYear()}-${z(now.getMonth() + 1)}-${z(now.getDate())}`
  document.getElementById('from').value = today
  document.getElementById('to').value = today
  load()
}

async function doLogin() {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const err = document.getElementById('loginErr')
  err.style.display = 'none'
  try {
    const r = await fetch('/portal/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    if (!r.ok) { err.textContent = 'Email atau password salah'; err.style.display = 'block'; return }
    showDash()
  } catch (e) {
    err.textContent = 'Gagal: ' + e.message
    err.style.display = 'block'
  }
}

async function doLogout() {
  if (!window.confirm('Yakin ingin keluar?')) return
  await fetch('/portal/api/logout', { method: 'POST' })
  showLogin()
}

document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin() })
document.getElementById('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin() })

async function load() {
  const errEl = document.getElementById('err')
  errEl.style.display = 'none'
  const from = document.getElementById('from').value
  const to = document.getElementById('to').value
  const filtered = !!(from || to)
  const qs = new URLSearchParams()
  qs.set('limit', '10000')
  if (from) qs.set('from', from)
  if (to) qs.set('to', to)
  const label = filtered ? 'Periode' : 'Semua'
  try {
    const [stats, tx, config] = await Promise.all([
      fetch('/portal/api/stats').then(r => { if(!r.ok) throw new Error('stats '+r.status); return r.json() }),
      fetch('/portal/api/transactions?' + qs.toString()).then(r => { if(!r.ok) throw new Error('tx '+r.status); return r.json() }),
      fetch('/api/config').then(r => r.json()).catch(() => ({}))
    ])
    const mode = config.mode === 'event' ? 'event' : 'regular'
    const modeLabel = mode === 'event' ? 'Event (Jasa)' : 'Regular'
    const modeDesc = mode === 'event'
      ? 'Booth branded acara, CETAK tanpa paywall (host bayar di awal)'
      : `Booth reguler, CETAK bayar Rp ${Number(config.price || 0).toLocaleString('id-ID')} / lembar`
    const evName = config.branding && config.branding.eventName ? config.branding.eventName : '—'
    const presetName = config.preset_name || '—'
    const total = tx.length
    const amount = tx.reduce((a, t) => a + Number(t.amount || 0), 0)
    const qris = tx.filter(t => t.method === 'qris').length
    const cash = tx.filter(t => t.method === 'cash').length
    const byHour = {}
    for (const t of tx) {
      const h = new Date(t.created_at).getHours()
      byHour[h] = (byHour[h] || 0) + 1
    }
    const hoursArr = Object.entries(byHour).map(([h, c]) => ({ hour: Number(h), cnt: c })).sort((a, b) => a.hour - b.hour)
    const modeCard = `
      <div class="card" style="grid-column:1/-1; border-color:${mode === 'event' ? '#7c3aed' : '#000'}; box-shadow:6px 6px 0 ${mode === 'event' ? '#7c3aed' : '#000'};">
        <div class="label">Mode Booth Aktif</div>
        <div class="val" style="font-size:24px;">${modeLabel}</div>
        <div class="sub">${modeDesc}</div>
        <div class="sub">Nama event: <b>${evName}</b> &nbsp;•&nbsp; Preset: <b>${presetName}</b></div>
      </div>`
    document.getElementById('kpis').innerHTML = modeCard + `
      <div class="card"><div class="label">Cetak (${label})</div><div class="val">${total}</div><div class="sub">total ${stats.summary.total_count}</div></div>
      <div class="card"><div class="label">Omzet (${label})</div><div class="val">${fmt(amount)}</div><div class="sub">total ${fmt(stats.summary.total_amount)}</div></div>
      <div class="card"><div class="label">QRIS (${label})</div><div class="val">${qris}</div><div class="sub">cetak ${label.toLowerCase()}</div></div>
      <div class="card"><div class="label">Cash (${label})</div><div class="val">${cash}</div><div class="sub">cetak ${label.toLowerCase()}</div></div>
    `
    document.getElementById('hours').textContent = hoursArr.length
      ? hoursArr.map(h => `${String(h.hour).padStart(2,'0')}:00 → ${h.cnt} cetak`).join('   •   ')
      : (filtered ? 'tidak ada transaksi di periode ini' : 'belum ada transaksi')
    allTx = tx
    page = 1
    renderPage()
  } catch (e) {
    if (String(e.message).includes('401')) {
      showLogin()
    } else {
      errEl.textContent = 'Gagal muat: ' + e.message
      errEl.style.display = 'block'
    }
  }
}

// ── Photos view ──
let selectedPhotos = new Set()
async function loadPhotos() {
  const grid = document.getElementById('photogrid')
  const errEl = document.getElementById('photoErr')
  errEl.style.display = 'none'
  const from = document.getElementById('pfrom').value
  const to = document.getElementById('pto').value
  const qs = new URLSearchParams()
  qs.set('limit', '500')
  if (from) qs.set('from', from)
  if (to) qs.set('to', to)
  grid.innerHTML = '<div style="opacity:.6; font-weight:800;">memuat…</div>'
  try {
    const rows = await fetch('/portal/api/photos?' + qs.toString()).then(r => {
      if (!r.ok) throw new Error('photos ' + r.status)
      return r.json()
    })
    if (!rows.length) {
      grid.innerHTML = '<div style="opacity:.7; font-weight:800;">belum ada foto di DB</div>'
      document.getElementById('selAll').checked = false
      updateSelCount()
      return
    }
    grid.innerHTML = rows.map(p => {
      const sel = selectedPhotos.has(p.id) ? 'sel' : ''
      const chk = selectedPhotos.has(p.id) ? 'checked' : ''
      return `
      <div class="photocard ${sel}" id="pc-${p.id}">
        <input type="checkbox" class="pick" ${chk} onchange="togglePick('${p.id}', this.checked)" title="Pilih" />
        <button class="del" title="Hapus" onclick="delPhoto('${p.id}')">🗑</button>
        <img src="${p.url}" alt="${p.id}" onclick="openLb('${p.url}')" loading="lazy" />
        <div class="meta">${fmtTime(p.created_at)}</div>
        <a href="${p.url}" target="_blank" rel="noreferrer">⬇ Buka</a>
      </div>`
    }).join('')
    syncSelAll()
  } catch (e) {
    if (String(e.message).includes('401')) { showLogin(); return }
    errEl.textContent = 'Gagal muat foto: ' + e.message
    errEl.style.display = 'block'
  }
}
function togglePick(id, on) {
  if (on) selectedPhotos.add(id); else selectedPhotos.delete(id)
  const pc = document.getElementById('pc-' + id)
  if (pc) pc.classList.toggle('sel', on)
  syncSelAll()
  updateSelCount()
}
function toggleSelectAll(on) {
  document.querySelectorAll('.photocard').forEach(card => {
    const id = card.id.replace('pc-', '')
    if (on) selectedPhotos.add(id); else selectedPhotos.delete(id)
    card.classList.toggle('sel', on)
    const cb = card.querySelector('.pick'); if (cb) cb.checked = on
  })
  updateSelCount()
}
function syncSelAll() {
  const cards = document.querySelectorAll('.photocard')
  const all = cards.length > 0 && [...cards].every(c => selectedPhotos.has(c.id.replace('pc-', '')))
  document.getElementById('selAll').checked = all
}
function updateSelCount() {
  const n = selectedPhotos.size
  document.getElementById('selCount').textContent = n
  document.getElementById('bulkDelBtn').style.display = n > 0 ? 'inline-block' : 'none'
}
function applyPhotoFilter() {
  const from = document.getElementById('pfrom').value
  const to = document.getElementById('pto').value
  if (from && to && to < from) {
    const e = document.getElementById('photoErr'); e.textContent = 'Tanggal "Sampai" harus ≥ "Dari"'; e.style.display = 'block'; return
  }
  loadPhotos()
}
function resetPhotoFilter() {
  document.getElementById('pfrom').value = ''
  document.getElementById('pto').value = ''
  loadPhotos()
}
function photoQuick(kind) {
  const now = new Date()
  let from
  if (kind === 'today') from = ymd(now)
  else if (kind === '7d') { const d = new Date(now); d.setDate(d.getDate() - 6); from = ymd(d) }
  else if (kind === '30d') { const d = new Date(now); d.setDate(d.getDate() - 29); from = ymd(d) }
  else return
  document.getElementById('pfrom').value = from
  document.getElementById('pto').value = ymd(now)
  loadPhotos()
}
async function delPhoto(id) {
  if (!window.confirm('Hapus foto ini?')) return
  try {
    const r = await fetch('/portal/api/photos/' + encodeURIComponent(id), { method: 'DELETE' })
    if (!r.ok) throw new Error('delete ' + r.status)
    selectedPhotos.delete(id)
    updateSelCount()
    loadPhotos()
  } catch (e) {
    if (String(e.message).includes('401')) { showLogin(); return }
    alert('Gagal hapus: ' + e.message)
  }
}
async function bulkDelete() {
  const ids = [...selectedPhotos]
  if (!ids.length) return
  if (!window.confirm('Hapus ' + ids.length + ' foto terpilih?')) return
  try {
    for (const id of ids) {
      await fetch('/portal/api/photos/' + encodeURIComponent(id), { method: 'DELETE' })
    }
    selectedPhotos.clear()
    updateSelCount()
    document.getElementById('selAll').checked = false
    loadPhotos()
  } catch (e) {
    if (String(e.message).includes('401')) { showLogin(); return }
    alert('Gagal hapus: ' + e.message)
  }
}
function openLb(url) {
  document.getElementById('lbImg').src = url
  document.getElementById('lb').style.display = 'flex'
}

function applyFilter() {
  const from = document.getElementById('from').value
  const to = document.getElementById('to').value
  if (from && to && to < from) {
    const e = document.getElementById('err')
    e.textContent = 'Tanggal "Sampai" harus ≥ "Dari"'
    e.style.display = 'block'
    return
  }
  load()
}

function resetFilter() {
  document.getElementById('from').value = ''
  document.getElementById('to').value = ''
  load()
}

function ymd(d) {
  const z = (n) => String(n).padStart(2, '0')
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`
}

function quickRange(kind) {
  const now = new Date()
  const fromEl = document.getElementById('from')
  const toEl = document.getElementById('to')
  let from
  if (kind === 'today') {
    from = ymd(now)
  } else if (kind === '7d') {
    const d = new Date(now); d.setDate(d.getDate() - 6); from = ymd(d)
  } else if (kind === '30d') {
    const d = new Date(now); d.setDate(d.getDate() - 29); from = ymd(d)
  } else if (kind === 'month') {
    from = ymd(new Date(now.getFullYear(), now.getMonth(), 1))
  } else {
    return
  }
  fromEl.value = from
  toEl.value = ymd(now)
  const e = document.getElementById('err'); e.style.display = 'none'
  load()
}

function exportCsv() {
  const from = document.getElementById('from').value
  const to = document.getElementById('to').value
  const qs = new URLSearchParams()
  if (from) qs.set('from', from)
  if (to) qs.set('to', to)
  const url = '/portal/api/export' + (qs.toString() ? '?' + qs.toString() : '')
  window.open(url, '_blank')
}

function showPwPanel() {
  const p = document.getElementById('pwPanel')
  p.style.display = 'flex'
  document.getElementById('pwErr').style.display = 'none'
  document.getElementById('pwOk').style.display = 'none'
  document.getElementById('pwCurrent').value = ''
  document.getElementById('pwNew').value = ''
  document.getElementById('pwConfirm').value = ''
  document.getElementById('pwCurrent').focus()
}

function hidePwPanel() {
  document.getElementById('pwPanel').style.display = 'none'
}

async function doChangePw() {
  const cur = document.getElementById('pwCurrent').value
  const nw = document.getElementById('pwNew').value
  const cf = document.getElementById('pwConfirm').value
  const err = document.getElementById('pwErr')
  const ok = document.getElementById('pwOk')
  err.style.display = 'none'; ok.style.display = 'none'
  if (nw !== cf) { err.textContent = 'Password baru tidak cocok'; err.style.display = 'block'; return }
  try {
    const r = await fetch('/portal/api/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current: cur, next: nw })
    })
    if (!r.ok) {
      const j = await r.json().catch(() => ({}))
      err.textContent = j.error || ('Gagal (' + r.status + ')')
      err.style.display = 'block'; return
    }
    ok.style.display = 'block'
    document.getElementById('pwCurrent').value = ''
    document.getElementById('pwNew').value = ''
    document.getElementById('pwConfirm').value = ''
  } catch (e) {
    err.textContent = 'Gagal: ' + e.message
    err.style.display = 'block'
  }
}

async function boot() {
  const r = await fetch('/portal/api/stats', { method: 'GET', headers: { 'Accept': 'application/json' } })
  if (r.ok) showDash()
  else showLogin()
}
boot()
setInterval(() => { if (currentView === 'dash') load() }, 20000)
